# Gateway resource for Application Gateway for Containers (AGC)
# This creates an AGC frontend that routes traffic to backend services via HTTPRoute.
# Replace <AGC_RESOURCE_ID> with the resource ID of your traffic controller
# from the 04-Network-LZ deployment.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: agc-gateway
  namespace: default
  annotations:
    alb.networking.azure.io/alb-id: "<AGC_RESOURCE_ID>"
spec:
  gatewayClassName: azure-alb-external
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
