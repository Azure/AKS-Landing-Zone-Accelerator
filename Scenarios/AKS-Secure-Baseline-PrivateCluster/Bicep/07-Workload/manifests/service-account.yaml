# ServiceAccount for Workload Identity
# The azure.workload.identity/client-id annotation links this K8s service account
# to the Azure managed identity via the federated credential.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: workload-sa
  namespace: default
  annotations:
    azure.workload.identity/client-id: "<WORKLOAD_IDENTITY_CLIENT_ID>"
  labels:
    azure.workload.identity/use: "true"
