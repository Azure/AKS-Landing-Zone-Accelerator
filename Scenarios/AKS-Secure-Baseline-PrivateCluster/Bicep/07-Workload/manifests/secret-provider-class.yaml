# SecretProviderClass - Key Vault CSI Driver with Workload Identity
# This tells the CSI driver which Key Vault secrets to mount into the pod.
# No base64-encoded Kubernetes Secrets are created - secrets are fetched at runtime.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: azure-kv-secrets
  namespace: default
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: "<WORKLOAD_IDENTITY_CLIENT_ID>"
    keyvaultName: "<KEYVAULT_NAME>"
    tenantId: "<TENANT_ID>"
    objects: |
      array:
        - |
          objectName: my-secret         # Name of the secret in Key Vault
          objectType: secret
          objectAlias: MY_SECRET        # Name of the mounted file
        - |
          objectName: my-connection-string
          objectType: secret
          objectAlias: CONNECTION_STRING
